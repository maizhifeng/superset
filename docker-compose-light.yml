# -----------------------------------------------------------------------
# Lightweight docker-compose for running multiple Superset instances
# This includes essential services: database, Redis, Superset app,
# frontend (Vite dev server) and the pi-agent AI backend
#
# RUNNING SUPERSET:
# 1. Start services: docker-compose -f docker-compose-light.yml up
# 2. Access at: http://localhost:9002 (or NODE_MUI_PORT if specified)
# 3. Frontend: MUI (Vite dev server), Backend: Flask dev server
#
# AI AGENT:
# - The pi-agent service runs the LLM agent loop server-side (WebSocket on
#   port 3001, internal only). The Vite dev server proxies /agent/ws to it.
# - LLM provider is configured via PI_AGENT_LLM_BASE_URL / PI_AGENT_LLM_MODEL
#   (defaults to LM Studio on the docker host).
# - Conversation transcripts and per-user model preferences are persisted in
#   the shared Postgres database (agent_sessions / agent_model_prefs tables).
#
#
# RUNNING MULTIPLE INSTANCES:
# - Use different project names: docker-compose -p project1 -f docker-compose-light.yml up
# - Use different NODE_PORT values: NODE_PORT=9002 docker-compose -p project2 -f docker-compose-light.yml up
# - Volumes are isolated by project name (e.g., project1_db_home_light, project2_db_home_light)
# - Database name is intentionally different (superset_light) to prevent accidental cross-connections
#
# RUNNING TESTS WITH PYTEST:
# Tests run in an isolated environment with a separate test database.
# The pytest-runner service automatically creates and initializes the test database on first use.
#
# Basic usage:
#   docker-compose -f docker-compose-light.yml run --rm pytest-runner pytest tests/unit_tests/
#
# Run specific test file:
#   docker-compose -f docker-compose-light.yml run --rm pytest-runner pytest tests/unit_tests/test_foo.py
#
# Run with pytest options:
#   docker-compose -f docker-compose-light.yml run --rm pytest-runner pytest -v -s -x tests/
#
# Force reload test database and run tests (when tests are failing due to bad state):
#   docker-compose -f docker-compose-light.yml run --rm -e FORCE_RELOAD=true pytest-runner pytest tests/
#
# Run any command in test environment:
#   docker-compose -f docker-compose-light.yml run --rm pytest-runner bash
#   docker-compose -f docker-compose-light.yml run --rm pytest-runner pytest --collect-only
#
# For parallel test execution with different projects:
#   docker-compose -p project1 -f docker-compose-light.yml run --rm pytest-runner pytest tests/
#
# DEVELOPMENT TIPS:
# - First test run takes ~20-30 seconds (database creation + initialization)
# - Subsequent runs are fast (~2-3 seconds startup)
# - Use FORCE_RELOAD=true when you need a clean test database
# - Tests use SimpleCache instead of Redis (no Redis required)
# - Set SUPERSET_LOG_LEVEL=debug in docker/.env-local for detailed logs
# -----------------------------------------------------------------------
x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - ./superset:/app/superset
  - superset_home_light:/app/superset_home
  - ./tests:/app/tests

x-mui-volumes: &mui-volumes
  - ./docker:/app/docker
  - ./superset:/app/superset
  - ./superset-frontend-new:/app/superset-frontend-new
  - superset_home_light:/app/superset_home
  - ./tests:/app/tests
x-common-build: &common-build
  context: .
  target: ${SUPERSET_BUILD_TARGET:-dev} # can use `dev` (default) or `lean`
  cache_from:
    - apache/superset-cache:3.10-slim-trixie
  args:
    DEV_MODE: "true"
    INCLUDE_CHROMIUM: ${INCLUDE_CHROMIUM:-false}
    INCLUDE_FIREFOX: ${INCLUDE_FIREFOX:-false}
    BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    UV_INDEX_URL: ${UV_INDEX_URL:-}

services:
  db-light:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:17
    restart: unless-stopped
    volumes:
      - ./pgdata_light:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: superset_light
    command: postgres -c max_connections=200

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  superset-light:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: *superset-user
    ports:
      - "8088:8088"
    depends_on:
      superset-init-light:
        condition: service_completed_successfully
    volumes: *superset-volumes
    environment:
      DATABASE_HOST: db-light
      DATABASE_DB: superset_light
      POSTGRES_DB: superset_light
      EXAMPLES_HOST: db-light
      EXAMPLES_DB: superset_light
      EXAMPLES_USER: superset
      EXAMPLES_PASSWORD: superset
      SUPERSET_CONFIG_PATH: /app/docker/pythonpath_dev/superset_config_docker_light.py
      GITHUB_HEAD_REF: ${GITHUB_HEAD_REF:-}
      GITHUB_SHA: ${GITHUB_SHA:-}

  superset-init-light:
    build:
      <<: *common-build
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    user: *superset-user
    depends_on:
      db-light:
        condition: service_started
      redis:
        condition: service_started
    volumes: *superset-volumes
    environment:
      DATABASE_HOST: db-light
      DATABASE_DB: superset_light
      POSTGRES_DB: superset_light
      EXAMPLES_HOST: db-light
      EXAMPLES_DB: superset_light
      EXAMPLES_USER: superset
      EXAMPLES_PASSWORD: superset
      SUPERSET_CONFIG_PATH: /app/docker/pythonpath_dev/superset_config_docker_light.py
      SUPERSET_LOAD_EXAMPLES: "no"
    healthcheck:
      disable: true

  superset-node:
    build:
      context: .
      target: superset-node
      args:
        DEV_MODE: "true"
        BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}
    environment:
      SCARF_ANALYTICS: "${SCARF_ANALYTICS:-}"
      superset: "http://superset-light:8088"
      SUPERSET_HOST: "http://superset-light:8088"
      # Vite proxies /agent/ws to the dedicated pi-agent service
      PI_AGENT_WS_TARGET: "ws://pi-agent:3001"
    ports:
      - "${NODE_PORT:-9000}:9000"
    command: ["/app/docker/docker-frontend-mui.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    volumes: *mui-volumes

  pi-agent:
    # AI agent backend: runs the LLM agent loop, chart-data acquisition and
    # conversation persistence server-side. The browser only talks to this
    # service over WebSocket (proxied by the Vite dev server).
    build:
      context: ./superset-frontend-new/agents/pi-agent-server
    restart: unless-stopped
    environment:
      WS_PORT: 3001
      LLM_MODEL: ${PI_AGENT_LLM_MODEL:-gemma-4-e2b-it}
      LLM_BASE_URL: ${PI_AGENT_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      FLASK_INTERNAL_URL: http://superset-light:8088
      # Same database as Superset; agent_* tables hold conversation
      # transcripts and per-user model preferences.
      DATABASE_URL: postgresql://superset:superset@db-light:5432/superset_light
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-light:
        condition: service_started
      superset-init-light:
        condition: service_completed_successfully
    # Mount source into the container and keep the image's own node_modules
    # (see superset-websocket service for the rationale).
    volumes:
      - ./superset-frontend-new/agents/pi-agent-server:/app
      - /app/node_modules

  pytest-runner:
    build:
      <<: *common-build
    entrypoint: ["/app/docker/docker-pytest-entrypoint.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    profiles:
      - test  # Only starts when --profile test is used
    depends_on:
      db-light:
        condition: service_started
    user: *superset-user
    volumes: *superset-volumes
    environment:
      DATABASE_HOST: db-light
      DATABASE_DB: test
      POSTGRES_DB: test
      SUPERSET__SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@db-light:5432/test
      SUPERSET_CONFIG: superset_test_config_light
      PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev:/app

volumes:
  superset_home_light:
    external: false
  redis:
    external: false
